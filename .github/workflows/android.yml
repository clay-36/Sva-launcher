name: Android build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      format:
        description: Build output
        type: choice
        required: true
        default: both
        options:
          - apk
          - aab
          - both
      sign_release:
        description: Sign release outputs (main branch only; requires signing secrets)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_APK: ${{ inputs.sign_release && 'app-release.apk' || 'app-release-unsigned.apk' }}
      SIGNING_LABEL: ${{ inputs.sign_release && 'signed' || 'unsigned' }}
    steps:
      - name: Restrict release signing to manual runs on main
        if: inputs.sign_release && (github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main')
        run: |
          echo '::error::Release signing is only allowed for manual runs on main.'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Check source hygiene
        run: |
          python3 scripts/audit-source.py
          python3 scripts/update-notices.py --check
      - name: Check native helpers
        run: ./scripts/check-native.sh
      - name: Test and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug
      - name: Prepare release keystore
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign_release
        env:
          SVA_KEYSTORE_BASE64: ${{ secrets.SVA_KEYSTORE_BASE64 }}
          SVA_STORE_PASSWORD: ${{ secrets.SVA_STORE_PASSWORD }}
          SVA_KEY_ALIAS: ${{ secrets.SVA_KEY_ALIAS }}
          SVA_KEY_PASSWORD: ${{ secrets.SVA_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = ['SVA_KEYSTORE_BASE64', 'SVA_STORE_PASSWORD', 'SVA_KEY_ALIAS', 'SVA_KEY_PASSWORD']
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Missing GitHub signing secrets: ' + ', '.join(missing))
          try:
              data = base64.b64decode(''.join(os.environ['SVA_KEYSTORE_BASE64'].split()), validate=True)
          except ValueError:
              raise SystemExit('SVA_KEYSTORE_BASE64 must contain a valid base64-encoded keystore.')
          if not data:
              raise SystemExit('The signing keystore is empty.')
          os.umask(0o077)
          path = Path(os.environ['RUNNER_TEMP']) / 'sva-signing' / 'release.jks'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(data)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'SVA_KEYSTORE_PATH={path}\n')
          PY
      - name: Build selected outputs
        env:
          BUILD_FORMAT: ${{ inputs.format }}
          SVA_STORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign_release && secrets.SVA_STORE_PASSWORD || '' }}
          SVA_KEY_ALIAS: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign_release && secrets.SVA_KEY_ALIAS || '' }}
          SVA_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign_release && secrets.SVA_KEY_PASSWORD || '' }}
        run: |
          case "$BUILD_FORMAT" in
            apk) tasks=(assembleDebug assembleRelease) ;;
            aab) tasks=(bundleRelease) ;;
            both|'') tasks=(assembleDebug assembleRelease bundleRelease) ;;
            *) echo '::error::Invalid build output selection.'; exit 1 ;;
          esac
          ./gradlew --no-daemon "${tasks[@]}"
      - name: Inspect release APK
        if: inputs.format != 'aab'
        run: python3 scripts/check-apk.py "app/build/outputs/apk/release/$RELEASE_APK" --zipalign "$ANDROID_HOME/build-tools/36.0.0/zipalign"
      - name: Verify release APK signature
        if: inputs.sign_release && inputs.format != 'aab'
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk'
      - name: Verify release AAB signature
        if: inputs.sign_release && inputs.format != 'apk'
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('app/build/outputs/bundle/release/app-release.aab') as bundle:
              assert any(name.startswith('META-INF/') and name.endswith(('.RSA', '.DSA', '.EC')) for name in bundle.namelist()), 'Release AAB has no signature'
          PY
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Remove temporary release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sva-signing/release.jks"
      - name: Upload debug APK
        if: inputs.format != 'aab'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sva-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload release APK
        if: inputs.format != 'aab'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sva-release-apk-${{ env.SIGNING_LABEL }}
          path: app/build/outputs/apk/release/${{ env.RELEASE_APK }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload release AAB
        if: inputs.format != 'apk'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sva-release-aab-${{ env.SIGNING_LABEL }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
