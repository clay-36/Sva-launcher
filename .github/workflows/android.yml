name: Android checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Check source hygiene
        run: |
          python3 scripts/audit-source.py
          python3 scripts/update-notices.py --check
      - name: Check native helpers
        run: ./scripts/check-native.sh
      - name: Test, lint, and build debug and unsigned release APKs
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Inspect release APK
        run: python3 scripts/check-apk.py app/build/outputs/apk/release/app-release-unsigned.apk --zipalign "$ANDROID_HOME/build-tools/36.0.0/zipalign"
