plugins {
    id "com.android.application"
}

android {
    namespace "com.sva.launcher"

    compileSdk 36

    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.sva.launcher"

        minSdk 26
        targetSdk 36

        versionCode 3
        versionName "3.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        externalNativeBuild {
            ndkBuild {
                arguments "NDK_APPLICATION_MK:=src/main/jni/Application.mk"
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }
    signingConfigs {
        release {
            storeFile file("../secrets/@flash777__everyside.jks")
            storePassword System.getenv("SVA_STORE_PASSWORD")
            keyAlias System.getenv("SVA_KEY_ALIAS")
            keyPassword System.getenv("SVA_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                    "proguard-android-optimize.txt"
            ), "proguard-rules.pro"
        }
    }

}

dependencies {
    def media3Version = "1.8.1"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
